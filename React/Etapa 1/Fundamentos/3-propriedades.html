<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocketseat - React.js - Fundamentos</title>
</head>

<body>
    <div id="root"></div>

    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

        const buttonVariants = { //
            default: 'bg-gray-500',
            primary: 'bg-purple-500'
        }

        const buttonSizes = {
            small: 'px-4 py-2',
            medium: 'px-8 py-4',
            large: 'px-12 py-6',
        }

        function Button({ variant = 'default', className, size = 'small', children, ...props }) { //define tipagens que podem existir, o "..." estende elas incluindo as nativas
            return (
                <button className={`
                    px-4 py-2 rounded text-white
                    ${buttonVariants[variant]} 
                    ${buttonSizes[size]}
                    ${className}
                    `}
                    {...props}
                >
                    {children}
                </button> //Seria usado props.children no lugar de {children}
            )
        }

        function App() {
            return (

                <main className="flex gap-2 p-3">
                    <Button variant="primary" size="medium" className="mr-14">
                        Botãozinho
                    </Button>
                    <Button title="Butón" size='large'>
                        Irmão do Botãozinho
                    </Button>
                </main>

            )
        }



        ReactDOM.createRoot(document.getElementById("root")).render(
            <App />
        )
    </script>

</body>

</html>
