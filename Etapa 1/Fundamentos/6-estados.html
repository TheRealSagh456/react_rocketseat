<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocketseat - React.js - Fundamentos</title>
</head>

<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

        function Counter() {
            const [counter, setCounter] = React.useState(0)
            const [name, setName] = React.useState('')

            React.useEffect(() => {
                console.log("Componente montado")

                return () => {
                    console.log("Componente desmontado")
                }
            }, [])

            React.useEffect(() => {
                if (counter > 0) {
                    console.log(`Contador atualizado: ${counter}`)
                }
            }, [counter])

            React.useEffect(() => {
                if (name.length > 0) {
                    console.log(`Nome atualizado: ${name}`)
                }
            }, [name])

            return (

                <>
                    <div>


                        <label>

                            <input onChange={(e) => setName(e.target.value)} />

                        </label>

                    </div>

                    <p>Contador: {counter}</p>
                    <button onClick={() => setCounter(100)}>Atualizar</button>
                    <p><button onClick={() => setCounter((prevValue) => prevValue + 1)}>Incrementar</button></p>
                    <p><button onClick={() => setCounter((prevValue) => prevValue - 1)}>Decrementar</button></p>
                </>
            )
        }

        function App() {
            const [show, setShow] = React.useState(true)

            return (

                <main className='p-3'>
                    <button onClick={() => setShow(!show)}>Mostrar/Ocultar Contagem</button>
                    <hr />
                    {show && <Counter />}
                </main>
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>

</body>

</html>
