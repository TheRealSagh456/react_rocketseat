<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocketseat - React.js - Fundamentos</title>
</head>

<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const users = [
            {id:1, name: "Zé Ramalho"},
            {id:2, name: "Milton Nascimento"},
            {id:3, name: "Chico Buarque"},
            {id:4, name: "Elis Regina"},
            {id:5, name: "Cartola"},
            {id:6, name: "Skank"},
        ]


        function App() {
            const [search,setSearch] = React.useState('')
            const [count, setCount] = React.useState(0)

            console.log("re-render!")

            const filteredUsers = React.useMemo(() => {
                console.log("Filtrando!")
                return users.filter(user => user.name.toLowerCase().includes(search.toLowerCase()))
            }, [search])

            return (
                <main className="m-6">
                    <input 
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                    placeholder="Buscar usuários..." 
                    className="border p-1 rounded pl-2"/>
                    
                    <button 
                    onClick={() => setCount(count+1)}
                    className={`
                        border border-black p-1 ml-3 rounded text-white 
                        bg-gray-600 pl-2 pr-2 cursor-pointer
                        `}>
                        re-render: {count}
                    </button>

                    <ul className="pt-4 ml-5">
                        {filteredUsers.map((user) => <li  className="pt-1 list-disc" key={user.id}>{user.name}</li>)}
                    </ul>
                </main>
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>

</body>

</html>
